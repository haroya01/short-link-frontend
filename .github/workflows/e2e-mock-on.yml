name: E2E (reader, mock-on)

# Reader-side rendering lane. The public post page is a Server Component that fetches its data
# server-side, so Playwright can't intercept it the way the mock-OFF authoring lane does. Instead this
# builds with NEXT_PUBLIC_USE_MOCKS=1 so the in-memory mock serves a deterministic post, and asserts
# what a VISITOR actually sees (every block type renders, editorial typography applies). No backend.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: e2e-mock-on-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-mock-on:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_USE_MOCKS: "1"
      # No network is hit in mock mode, but the build still wants a base defined.
      NEXT_PUBLIC_API_BASE: http://localhost:0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Build Next.js (mock-on)
        run: npm run build
      - name: Start Next.js
        run: |
          PORT=3001 npm start &
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3001/ko >/dev/null; then
              echo "next is up"
              break
            fi
            sleep 1
          done
      - name: Run reader-render e2e
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3001
          CI: "true"
        run: npx playwright test e2e/blog-post-render.spec.ts e2e/post-highlights.spec.ts e2e/comment-jump.spec.ts e2e/notes.spec.ts e2e/follow-requests.spec.ts e2e/notification-policy.spec.ts e2e/notification-kinds.spec.ts e2e/mention-autocomplete.spec.ts e2e/post-quote-notes.spec.ts e2e/note-thread-parts.spec.ts e2e/data-export.spec.ts e2e/blog-navigation.spec.ts e2e/blog-screens.spec.ts e2e/all-screens.spec.ts e2e/blog-collections.spec.ts e2e/blog-shortener-fusion.spec.ts e2e/blog-library.spec.ts e2e/links-library-ux.spec.ts e2e/link-in-bio-status.spec.ts e2e/series-notes.spec.ts e2e/feed-rows.spec.ts e2e/feed-header.spec.ts e2e/viewer-filter.spec.ts e2e/compose-chooser.spec.ts e2e/post-editor-guards.spec.ts e2e/user-block.spec.ts e2e/discovery-signed-in.spec.ts e2e/block-menus.spec.ts e2e/profile-protected-link.spec.ts e2e/edit-conflict.spec.ts e2e/login-surface.spec.ts e2e/conversation-safety.spec.ts e2e/conversation-row.spec.ts e2e/conversation-composer.spec.ts e2e/conversation-jump.spec.ts e2e/compact-time.spec.ts e2e/honest-states.spec.ts e2e/post-dock.spec.ts e2e/user-content-lang.spec.ts e2e/empty-states.spec.ts e2e/long-labels.spec.ts e2e/collection-ordered.spec.ts e2e/reply-controls.spec.ts e2e/catalog-copy.spec.ts e2e/people-and-mentions.spec.ts e2e/highlight-reply-reactions.spec.ts e2e/like-failed.spec.ts e2e/profile-replies-media.spec.ts e2e/taken-down-post.spec.ts e2e/note-drafts.spec.ts e2e/profile-header.spec.ts e2e/editor-link-insert.spec.ts e2e/post-action-row.spec.ts e2e/plain-ui.spec.ts e2e/comment-link-insert.spec.ts e2e/avatar-tint.spec.ts e2e/editor-publish-flow.spec.ts e2e/blog-write-workspace.spec.ts e2e/account-menu.spec.ts e2e/blog-link-conventions.spec.ts e2e/post-end-and-names.spec.ts e2e/menu-keys.spec.ts e2e/blog-profile-edit.spec.ts e2e/blog-ai-tells.spec.ts e2e/nav-current-tab.spec.ts e2e/profile-editor-dark.spec.ts e2e/note-reply-sheet.spec.ts e2e/links-plain-ui.spec.ts e2e/federation-search.spec.ts e2e/remote-safety.spec.ts e2e/remote-note-shapes.spec.ts e2e/editor-safety.spec.ts e2e/post-audience-reader.spec.ts e2e/kindred-viewer.spec.ts e2e/remote-search-hint.spec.ts e2e/image-variants.spec.ts e2e/follow-known-state.spec.ts e2e/phone-notes-parity.spec.ts e2e/poll-choice-buttons.spec.ts e2e/editor-hash-caret.spec.ts e2e/note-media-play.spec.ts e2e/notes-static.spec.ts e2e/note-camera.spec.ts e2e/note-publish-motion.spec.ts e2e/related-tags.spec.ts e2e/explore.spec.ts e2e/home-feed.spec.ts --project=chromium
      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-e2e-mock-on-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  e2e-webkit-access:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_USE_MOCKS: "1"
      NEXT_PUBLIC_API_BASE: http://127.0.0.1:4010
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Install Playwright WebKit
        run: npx playwright install --with-deps webkit
      - name: Build Next.js (mock-on, cross-origin API base)
        run: npm run build
      - name: Start Next.js
        run: |
          PORT=3001 npm start &
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3001/ko >/dev/null; then
              echo "next is up"
              break
            fi
            sleep 1
          done
      - name: Run post access e2e on WebKit
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3001
          E2E_API_PORT: "4010"
          CI: "true"
        run: npx playwright test e2e/post-audience-reader.spec.ts e2e/post-audience-webkit.spec.ts e2e/domain-autocomplete-webkit.spec.ts --project=webkit-iphone --project=webkit-desktop
      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-e2e-webkit-access-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
